name: Publicar laudo do ciclo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ex: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  publicar:
    name: Gerar e anexar o laudo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o repositório na tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Preparar o uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync

      - name: Portão de formatação
        run: uv run ruff format --check .

      - name: Portão de lint
        run: uv run ruff check .

      - name: Portão de docstrings
        run: uv run python tools/verify_docstrings.py

      - name: Portão de código morto
        run: uv run python tools/verify_dead_code.py

      - name: Suíte de testes
        run: uv run python -m unittest discover tests

      - name: Portão de privacidade
        run: uv run python -m observatorio.cli verify-privacy --all-files

      - name: Restaurar cache da release anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          origem=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[] | select(.assets[]?.name == "cache-html.tar.gz")] | sort_by(.created_at) | reverse | .[0].tag_name')
          if [ -z "$origem" ] || [ "$origem" = "null" ]; then
            echo "Nenhuma release anterior com cache; o ciclo baixa tudo da rede."
            echo "CACHE_ORIGEM=nenhuma" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p /tmp/cache-anterior data/raw
          if gh release download "$origem" --pattern cache-html.tar.gz --dir /tmp/cache-anterior --clobber; then
            tar -xzf /tmp/cache-anterior/cache-html.tar.gz -C data/raw
            echo "Cache restaurado de $origem: $(ls data/raw/html_cache | wc -l) arquivos"
            echo "CACHE_ORIGEM=$origem" >> "$GITHUB_ENV"
          else
            echo "Falha ao baixar o cache de $origem; o ciclo segue sem cache."
            echo "CACHE_ORIGEM=$origem (falha ao baixar)" >> "$GITHUB_ENV"
          fi

      - name: Executar o ciclo de auditoria
        run: uv run python -m observatorio.cli audit-all --workers 8 --timeout 12

      - name: Portão de integridade do cache
        run: uv run python tools/verify_cache.py

      - name: Empacotar cache de HTML
        run: tar -czf cache-html.tar.gz -C data/raw html_cache

      - name: Registrar procedência
        env:
          TAG: ${{ env.TAG }}
        run: |
          uv run python - <<'PY'
          import collections
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"]
          cache_origem = os.environ.get("CACHE_ORIGEM", "nenhuma")
          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True
          ).stdout.strip()
          manifesto = json.loads(Path("data/estado_hashes.json").read_text(encoding="utf-8"))
          laudo = json.loads(Path("dist/auditoria_iniciativas.json").read_text(encoding="utf-8"))
          status = collections.Counter(entrada["status"] for entrada in manifesto["entries"])

          linhas = [
              f"Tag: {tag}",
              f"Commit: {commit}",
              f"Ciclo: {manifesto['generated_at']}",
              f"Laudos emitidos: {len(laudo)}",
              f"Entradas no manifesto: {manifesto['total']}",
              f"Cache de partida: {cache_origem}",
              "",
              "Distribuição por status:",
          ]
          for nome, quantidade in sorted(status.items()):
              linhas.append(f"  {nome}: {quantidade}")

          try:
              gravado = json.loads(
                  subprocess.run(
                      ["git", "show", "HEAD:data/estado_hashes.json"],
                      capture_output=True,
                      text=True,
                      check=True,
                  ).stdout
              )
          except Exception:
              gravado = None

          if gravado is None:
              linhas += ["", "Manifesto commitado na tag não encontrado: sem base de comparação."]
          else:
              na_tag = {entrada["tool_id"]: entrada for entrada in gravado["entries"]}
              agora = {entrada["tool_id"]: entrada for entrada in manifesto["entries"]}
              mudou_status = [
                  (chave, na_tag[chave]["status"], agora[chave]["status"])
                  for chave in sorted(na_tag)
                  if chave in agora and na_tag[chave]["status"] != agora[chave]["status"]
              ]
              mudou_html = [
                  chave
                  for chave in na_tag
                  if chave in agora and na_tag[chave]["html_sha256"] != agora[chave]["html_sha256"]
              ]
              linhas += [
                  "",
                  "Divergência em relação ao manifesto commitado na tag:",
                  f"  Manifesto da tag: ciclo {gravado['generated_at']}, protocolo {gravado['protocol_version']}",
                  f"  Status diferentes: {len(mudou_status)} de {len(na_tag)}",
              ]
              for chave, antes, depois in mudou_status[:20]:
                  linhas.append(f"    {chave}: {antes} -> {depois}")
              if len(mudou_status) > 20:
                  linhas.append(f"    ... e mais {len(mudou_status) - 20}")
              linhas += [
                  f"  HTML diferente: {len(mudou_html)} de {len(na_tag)}",
                  "  A divergência é esperada: esta release reexecutou o ciclo em vez de copiar o",
                  "  manifesto da tag. Status diferente indica página que respondeu de outro modo ao",
                  "  runner; HTML diferente indica conteúdo volátil ou alteração real desde a tag.",
                  "  O estado vigente do repositório é o manifesto commitado; este anexo é o snapshot",
                  "  do ciclo executado na publicação.",
              ]
          linhas += [
              "",
              "Arquivos anexados:",
              "  auditoria_iniciativas.json  laudo completo do ciclo",
              "  estado_hashes.json          hash, status e notas por iniciativa",
              "  cache-html.tar.gz           corpos lidos, que permitem recalcular as notas offline",
              "  SHA256SUMS                  integridade dos arquivos acima",
              "",
              "Para recalcular as notas a partir do cache anexado:",
              "  tar -xzf cache-html.tar.gz -C data/raw",
              "  uv run python tools/verify_cache.py",
              "  uv run python -m observatorio.cli audit-all --refresh",
              "",
              "O laudo não é versionado no repositório: ele é publicado aqui, e o manifesto",
              "versionado registra hash, status e notas de cada iniciativa.",
              "",
          ]
          Path("PROCEDENCIA.txt").write_text("\n".join(linhas), encoding="utf-8")
          print("\n".join(linhas[:6]))
          PY

      - name: Preparar anexos
        run: |
          cp dist/auditoria_iniciativas.json auditoria_iniciativas.json
          cp data/estado_hashes.json estado_hashes.json
          ls -lh auditoria_iniciativas.json estado_hashes.json cache-html.tar.gz PROCEDENCIA.txt

      - name: Calcular somas de verificação
        run: |
          sha256sum auditoria_iniciativas.json estado_hashes.json cache-html.tar.gz PROCEDENCIA.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG já existe; anexando arquivos."
          else
            gh release create "$TAG" --title "$TAG" --notes-file PROCEDENCIA.txt
          fi
          gh release upload "$TAG" \
            auditoria_iniciativas.json \
            estado_hashes.json \
            cache-html.tar.gz \
            SHA256SUMS \
            PROCEDENCIA.txt \
            --clobber
