name: Observatorio Monitoramento Civico

on:
  schedule:
    # Executa semanalmente aos domingos às 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Forçar reavaliação ignorando cache de SHA-256'
        required: false
        default: false
        type: boolean
      skip_archive:
        description: 'Pular disparos ao Internet Archive'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'data/data_iniciativas.json'
      - 'src/observatorio/**'

permissions:
  contents: write

concurrency:
  group: observatorio-pipeline
  cancel-in-progress: true

jobs:
  monitor-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v5

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar Dependências Python
        run: uv sync

      - name: Portão Preventivo de Privacidade (LGPD & Segredos)
        run: uv run python -m observatorio.cli verify-privacy --all-files

      - name: Lint e Formatação (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Detecção de Código Morto (vulture)
        run: uv run python tools/verify_dead_code.py

      - name: Padrão de Docstrings e Ausência de Comentários
        run: uv run python tools/verify_docstrings.py

      - name: Executar Bateria de Testes Unitários
        run: uv run python -m unittest discover tests

      - name: Executar Esteira de Monitoramento e Avaliação Cívica
        env:
          ENTRADA_REFRESH: ${{ inputs.refresh }}
          ENTRADA_SKIP_ARCHIVE: ${{ inputs.skip_archive }}
          IA_S3_ACCESS_KEY: ${{ secrets.IA_S3_ACCESS_KEY }}
          IA_S3_SECRET_KEY: ${{ secrets.IA_S3_SECRET_KEY }}
        run: |
          ARGS=""
          if [ "$ENTRADA_REFRESH" = "true" ]; then
            ARGS="$ARGS --refresh"
          fi
          if [ "$ENTRADA_SKIP_ARCHIVE" = "true" ]; then
            ARGS="$ARGS --skip-archive"
          fi
          uv run python -m observatorio.cli audit-all $ARGS

      - name: Verificar Alterações no Manifesto de Estado
        id: git-check
        run: |
          git status --porcelain
          echo "has_changes=$(git status --porcelain | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Publicar Laudo Completo como Artefato do Ciclo
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-iniciativas
          path: dist/auditoria_iniciativas.json
          retention-days: 90

      - name: Autocommit do Manifesto de Estado
        id: autocommit
        if: github.event_name != 'pull_request' && steps.git-check.outputs.has_changes != '0'
        run: |
          git config user.name "TecnoPopular Observatorio Bot"
          git config user.email "bot@tecnopopular.org"
          git add data/estado_hashes.json
          git commit -m "chore(estado): atualiza manifesto de hashes e scores do ciclo semanal [skip ci]"
          if git push; then
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::manifesto não entrou em main: a regra do repositório recusa push direto. O arquivo segue anexado ao ciclo."
          fi

      - name: Preservar Manifesto Fora do Histórico
        if: steps.autocommit.outputs.publicado == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: estado-manifesto
          path: data/estado_hashes.json
          retention-days: 90
