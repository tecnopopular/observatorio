[project]
name = "observatorio"
version = "0.2.2"
description = "Observatório TecnoPopular: Monitoramento, telemetria e diagnóstico contínuo de iniciativas cívicas"
readme = "README.md"
authors = [
    { name = "TecnoPopular", email = "contato@tecnopopular.org" }
]
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "vulture>=2.14.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["data/raw", "dist", ".venv", ".specify", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["observatorio"]

[tool.vulture]
min_confidence = 60
paths = ["src", "tools", "tests"]
